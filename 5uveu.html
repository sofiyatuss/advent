<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2238">
<title>Plop&#39;s Advent · Day 2</title>
<link rel="stylesheet" href="style.css">
<style>
  .prog { display: flex; gap: 4px; margin-bottom: 14px; }
  .prog i { flex: 1; height: 10px; background: var(--cream); border: 2px solid var(--ink); }
  .prog i.done { background: var(--pine); }
  .q-num { text-align: center; font-family: 'Nunito', sans-serif; font-size: 21px; opacity: .7; margin: 0; }
  .q { text-align: center; font-size: 22px; font-weight: 600; margin: 4px 0 14px; }
  .opt {
    display: block; width: 100%; font-family: inherit; font-size: 19px; color: var(--cream);
    border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink); padding: 18px 12px; cursor: pointer; line-height: 1.3;
  }
  .opt.a { background: var(--red); }
  .opt.b { background: #3E6F9E; }
  .opt:active { transform: translateY(4px); box-shadow: none; }
  .or { text-align: center; font-size: 20px; font-weight: 600; margin: 10px 0; }
  .react { font-family: 'Patrick Hand', cursive; font-size: 19px !important; display: flex; gap: 10px; align-items: center; min-height: 64px; margin-top: 14px; font-size: 16px; }
  .react .plop-xs { width: 56px; }
  .answers { list-style: none; padding: 0; margin: 0 0 14px; }
  .answers li { background: var(--cream); border: 3px solid var(--ink); padding: 8px 10px; margin-bottom: 8px; font-size: 16px; }
  .answers li span { display: block; font-size: 13px; opacity: .65; }
  .done-title { text-align: center; font-size: 24px; margin: 0 0 12px; }
</style>
</head>
<body data-day="2">
<div class="wrap">
  <header class="day-head" id="day-head"></header>

  <main class="card hidden" id="content">
    <!-- ===== DAY 2: Would you rather ===== -->
    <div id="stage"></div>
    <!-- ===== end of day 2 content ===== -->
  </main>

  <footer id="day-foot"></footer>
</div>
<script src="plop.js"></script>
<script src="advent.js"></script>
<script>
  initDay();

  // ---- edit the questions here: [option A, option B] ----
  const QUESTIONS = [
    ['Fight 1 horse-sized pigeon', 'Fight 100 pigeon-sized horses'],
    ['Have your search history read out at your wedding', 'Have your camera roll shown at your funeral'],
    ['Ghost your mom', 'Ghost your therapist'],
    ['Get stuck in a lift with the devil', "Get stuck in a lift with the devil's mum"],
    ['Live together in Tokyo', 'Live together in London'],
    ["My Kazakh chocolate", "Danya's Kazakh chocolate"],
    ['Read minds', 'Turn invisible'],
    ['Have a job', 'Be unemployed'],
    ['Study for 5 hours', 'Clean the yacht from top to bottom'],
    ['Be the funniest person in every room', 'Be the smartest person in every room']
  ];

  const REACTIONS = [
    'Interesting choice. Plop is taking notes.',
    'Plop respects it.',
    'Plop would have picked the other one, but okay.',
    'Bold. Very bold.',
    'Plop is concerned but supportive.',
    'Correct answer. (There are no correct answers.)',
    'Plop has screenshotted this.',
    'Coo. That means "valid" in pigeon.'
  ];

  const picks = [];
  let i = 0;
  const stage = document.getElementById('stage');

  function show(reaction) {
    if (i >= QUESTIONS.length) return finish();
    const [a, b] = QUESTIONS[i];
    stage.innerHTML = `
      <div class="prog">${QUESTIONS.map((_, k) => `<i class="${k < i ? 'done' : ''}"></i>`).join('')}</div>
      <p class="q-num">QUESTION ${i + 1} OF ${QUESTIONS.length}</p>
      <p class="q">Would you rather…</p>
      <button class="opt a">${a}</button>
      <div class="or">or</div>
      <button class="opt b">${b}</button>
      <div class="react">${reaction ? `<div class="plop-xs">${plopSVG({ outfit: '#4F7A55' })}</div><div>${reaction}</div>` : ''}</div>`;
    stage.querySelector('.a').onclick = () => pick(a, b);
    stage.querySelector('.b').onclick = () => pick(b, a);
  }

  function pick(chosen, other) {
    picks.push({ chosen, other });
    i++;
    show(REACTIONS[Math.floor(Math.random() * REACTIONS.length)]);
  }

  function finish() {
    store.set('wyr', picks);
    const text = picks.map((p, k) => `${k + 1}. ${p.chosen}`).join('\n');
    stage.innerHTML = `
      <p class="done-title">Your answers</p>
      <ul class="answers">${picks.map(p => `<li>${p.chosen}<span>over: ${p.other}</span></li>`).join('')}</ul>
      <a class="btn btn-reply" href="${whatsappLink('Day 2, my would you rathers:\n' + text)}" target="_blank" rel="noopener">Send my answers to Sofi</a>
      <button class="btn" onclick="location.reload()">Play again</button>`;
  }

  show();
</script>
</body>
</html>
