<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2238">
<title>Plop&#39;s Advent · Day 20</title>
<link rel="stylesheet" href="style.css">
<style>
  #content { padding: 12px 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 8px; }
  .top b { font-family: 'Pixelify Sans', monospace; font-size: 20px; }
  .intro { text-align: center; margin: 0 0 10px; }
  .scene { position: relative; border: 4px solid var(--ink); overflow: hidden; touch-action: manipulation; background: #111; }
  .scene img.photo { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
  .hide { position: absolute; pointer-events: none; }
  .hide svg { width: 100%; height: auto; display: block; }
  .ring { position: absolute; border: 4px solid #E9B84A; border-radius: 50%; pointer-events: none; animation: ring .6s steps(3); }
  .miss { position: absolute; font-family: 'Pixelify Sans', monospace; font-size: 16px; color: #fff; background: var(--red); padding: 2px 6px; border: 2px solid var(--ink); pointer-events: none; transform: translate(-50%, -50%); animation: fade 0.8s forwards; }
  .hintzone { position: absolute; border: 4px dashed #E9B84A; pointer-events: none; animation: blink 0.5s steps(1) 6; }
  .msg { text-align: center; min-height: 28px; font-size: 20px; margin: 10px 0 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .btn { margin: 0; font-size: 18px; }
  .final { text-align: center; }
  .final .big { font-family: 'Pixelify Sans', monospace; font-size: 46px; color: var(--red); margin: 4px 0; }
  .final .plop-md { width: 130px; margin: 0 auto; }
  @keyframes ring { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fade { to { opacity: 0; transform: translate(-50%, -120%); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body data-day="20">
<div class="wrap">
  <header class="day-head" id="day-head"></header>

  <main class="card hidden" id="content">
    <!-- ===== DAY 20: Spot the pigeon ===== -->
    <div id="stage"></div>
    <!-- ===== end of day 20 content ===== -->
  </main>

  <footer id="day-foot"></footer>
</div>
<script src="plop.js"></script>
<script src="advent.js"></script>
<script>
  initDay();

  // ---- the rounds: where Plop hides (x, y = centre in % of the photo, w = size in % of photo width, flip, opacity) ----
  const ROUNDS = [
    { src: 'spot-1.jpg', x: 86, y: 80, w: 8,  flip: true,  op: .85 },
    { src: 'spot-2.jpg', x: 24, y: 40, w: 6,  flip: false, op: .8 },
    { src: 'spot-3.jpg', x: 37, y: 44, w: 7,  flip: false, op: .9 },
    { src: 'spot-4.jpg', x: 89, y: 31, w: 7,  flip: true,  op: .9 },
    { src: 'spot-5.jpg', x: 79, y: 14, w: 7,  flip: true,  op: .85 }
  ];
  const MISSES = ['nope', 'not there', 'cold', 'colder', 'lol no', 'that\'s a person'];

  const stage = document.getElementById('stage');
  let i = 0, start = 0, total = 0, misses = 0, found = false;

  function intro() {
    stage.innerHTML = `<div class="final">
        <div class="plop-md" id="plop-i"></div>
        <h2>Where's Plop?</h2>
        <p>Plop snuck into ${ROUNDS.length} of our photos. Find him as fast as you can. Tap him when you spot him.</p>
        <button class="btn btn-reply" id="go">Start the hunt 🔍</button>
      </div>`;
    mountPlop(document.getElementById('plop-i'), { outfit: '#3E7CB1' });
    document.getElementById('go').onclick = () => { i = 0; total = 0; round(); };
  }

  function round() {
    if (i >= ROUNDS.length) return finish();
    const r = ROUNDS[i];
    found = false; misses = 0;
    stage.innerHTML = `
      <div class="top"><span>Photo ${i + 1} / ${ROUNDS.length}</span><b id="clock">0.0s</b></div>
      <div class="scene" id="scene">
        <img class="photo" src="${r.src}" alt="" draggable="false">
        <div class="hide" style="left:${r.x - r.w / 2}%;top:${r.y}%;width:${r.w}%;opacity:${r.op};transform:translateY(-50%)">${plopSVG({ outfit: '#3E7CB1', flip: r.flip })}</div>
      </div>
      <p class="msg hand" id="msg">Where is he…</p>
      <div class="row"><button class="btn" id="hint">Hint</button><button class="btn btn-reply hidden" id="next">${i < ROUNDS.length - 1 ? 'Next photo →' : 'See my time'}</button></div>`;
    const scene = document.getElementById('scene');
    const img = scene.querySelector('img');
    const begin = () => { start = performance.now(); tick(); };
    img.complete ? begin() : img.onload = begin;

    scene.addEventListener('click', e => {
      if (found) return;
      const b = scene.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width * 100, py = (e.clientY - b.top) / b.height * 100;
      const ratio = b.height / b.width;
      const dx = px - r.x, dy = (py - r.y) * ratio;
      if (Math.hypot(dx, dy) < r.w * 0.9) hit(scene, r);
      else {
        misses++;
        const m = document.createElement('div'); m.className = 'miss';
        m.style.left = px + '%'; m.style.top = py + '%';
        m.textContent = MISSES[Math.floor(Math.random() * MISSES.length)];
        scene.appendChild(m); setTimeout(() => m.remove(), 800);
        if (misses === 4) document.getElementById('msg').textContent = 'Need help? Try the hint button.';
      }
    });
    document.getElementById('hint').onclick = () => {
      const z = document.createElement('div'); z.className = 'hintzone';
      const half = 50 / 2; // a box half the photo wide around Plop
      const lx = Math.min(100 - half * 2, Math.max(0, r.x - half)), ty = Math.min(55, Math.max(0, r.y - 22));
      z.style.left = lx + '%'; z.style.top = ty + '%'; z.style.width = (half * 2) + '%'; z.style.height = '45%';
      scene.appendChild(z); setTimeout(() => z.remove(), 3100);
      start -= 5000; // hints cost 5 seconds
      document.getElementById('msg').textContent = 'Somewhere in there… (+5s)';
    };
    document.getElementById('next').onclick = () => { i++; round(); document.getElementById('content').scrollIntoView({ behavior: 'smooth' }); };
  }

  function tick() {
    if (found || !document.getElementById('clock')) return;
    document.getElementById('clock').textContent = ((performance.now() - start) / 1000).toFixed(1) + 's';
    requestAnimationFrame(tick);
  }

  function hit(scene, r) {
    found = true;
    const t = (performance.now() - start) / 1000; total += t;
    document.getElementById('clock').textContent = t.toFixed(1) + 's';
    const ring = document.createElement('div'); ring.className = 'ring';
    const size = r.w * 2.2;
    ring.style.width = size + '%'; ring.style.aspectRatio = '1';
    ring.style.left = (r.x - size / 2) + '%'; ring.style.top = `calc(${r.y}% - ${scene.clientWidth * size / 200}px)`;
    scene.appendChild(ring);
    const lines = ['Found him!', 'Got him!', 'There he is!', 'Plop has been caught.', 'Gotcha!'];
    document.getElementById('msg').textContent = `${lines[i % lines.length]} ${t.toFixed(1)}s`;
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('next').classList.remove('hidden');
    document.querySelector('.row').style.gridTemplateColumns = '1fr';
  }

  function finish() {
    const secs = Math.round(total * 10) / 10;
    const prev = store.get('spot-best', null);
    const isBest = prev === null || secs < prev;
    if (isBest) { store.set('spot-best', secs); const b = store.get('best', {}); b.spot = secs + 's'; store.set('best', b); }
    const rank = secs < 20 ? 'Eagle eyes. Plop is scared of you.' : secs < 45 ? 'Certified pigeon spotter.' : 'Plop was right there the whole time…';
    stage.innerHTML = `<div class="final">
        <div class="plop-md" id="plop-f"></div>
        <div class="big">${secs}s</div>
        <p class="hand" style="font-size:22px">${rank}</p>
        <p>${isBest ? '⭐ New best time! ⭐' : 'Best: ' + prev + 's'}</p>
        <a class="btn btn-reply" target="_blank" rel="noopener" href="${whatsappLink("Day 20: I found Plop in all " + ROUNDS.length + " photos in " + secs + "s 🔍🐦")}">Send my time to Sofi</a>
        <button class="btn" id="again">Play again</button>
      </div>`;
    mountPlop(document.getElementById('plop-f'), { outfit: '#3E7CB1' });
    document.getElementById('again').onclick = () => { i = 0; total = 0; round(); };
  }

  intro();
</script>
</body>
</html>
