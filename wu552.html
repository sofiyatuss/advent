<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2B2238">
<title>Plop&#39;s Advent · Day 23</title>
<link rel="stylesheet" href="style.css">
<style>
  #content { padding: 10px; }
  .hud { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin: 0 4px 8px; }
  .hud b { font-family: 'Pixelify Sans', monospace; font-size: 24px; }
  .game { position: relative; border: 4px solid var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; background: #2B2238; }
  canvas { display: block; width: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(43, 34, 56, .78); color: var(--cream); text-align: center; padding: 20px;
  }
  .overlay h2 { font-size: 30px; margin: 0 0 6px; color: var(--gold); }
  .overlay p { margin: 0 0 12px; font-size: 18px; }
  .overlay .plop-md { width: 120px; margin-bottom: 6px; }
  .overlay .btn { max-width: 240px; }
  .tip { text-align: center; font-size: 15px; opacity: .7; margin: 10px 0 0; }
</style>
</head>
<body data-day="23">
<div class="wrap">
  <header class="day-head" id="day-head"></header>

  <main class="card hidden" id="content">
    <!-- ===== DAY 23: Flappy Pigeon ===== -->
    <div class="hud"><span>Score <b id="score">0</b></span><span>🍞 <b id="crumbs">0</b></span><span>Best <b id="best">0</b></span></div>
    <div class="game" id="game">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
    <p class="tip">Tap anywhere in the game to flap</p>
    <!-- ===== end of day 23 content ===== -->
  </main>

  <footer id="day-foot"></footer>
</div>
<script src="plop.js"></script>
<script src="advent.js"></script>
<script>
initDay();

(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  let W, H, U; // U = 1% of height

  function resize() {
    W = cv.parentElement.clientWidth; H = Math.round(W * 1.45); U = H / 100;
    const dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
  }

  // Plop sprite facing right, with a wing-up frame
  function sprite(wingUp) {
    const c = document.createElement('canvas'); c.width = 34; c.height = 33;
    const x = c.getContext('2d'), pal = Object.assign({}, PLOP_PALETTE, { R: '#2E86AB' });
    const col = ch => ch === 'r' ? _shade(pal.R, .76) : ch === 'g' ? _shade(pal.G, .85) : ch === 'd' ? _shade(pal.G, .66) : ch === 'L' ? _shade(pal.G, 1.18) : pal[ch];
    PLOP_SPRITE.forEach((row, y) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i]; if (ch === '.') continue;
        x.fillStyle = col(ch); x.fillRect(33 - i, y, 1, 1);
      }
    });
    if (wingUp) { // lift the wing
      x.fillStyle = pal.K; x.fillRect(8, 14, 12, 2);
      x.fillStyle = _shade(pal.G, .85); x.fillRect(9, 12, 10, 3);
      x.fillStyle = pal.K; x.fillRect(8, 11, 12, 1);
    }
    return c;
  }
  const SPR = [sprite(false), sprite(true)];

  let state, bird, pipes, crumbs, score, nCrumbs, t0, shake, spawnX;
  const best = () => getBest('flappy') || 0;
  const hud = () => {
    document.getElementById('score').textContent = score;
    document.getElementById('crumbs').textContent = nCrumbs;
    document.getElementById('best').textContent = Math.max(best(), score);
  };

  function reset() {
    bird = { x: W * .28, y: H * .42, v: 0, r: U * 3.2 };
    pipes = []; crumbs = []; score = 0; nCrumbs = 0; shake = 0; spawnX = W + 40;
    hud();
  }

  function flap() {
    if (state === 'ready') return start();
    if (state !== 'play') return;
    bird.v = -U * 62;
  }
  const game = document.getElementById('game');
  game.addEventListener('pointerdown', e => { if (e.target.closest('.overlay .btn')) return; e.preventDefault(); flap(); });
  addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flap(); } });

  function showReady() {
    state = 'ready'; reset();
    overlay.style.display = 'flex';
    overlay.innerHTML = `<div class="plop-md" id="ov-plop"></div><h2>Flappy Plop</h2>
      <p>Fly Plop over the rooftops of Vienna.<br>Don't hit the chimneys. Grab the bread 🍞</p>
      <button class="btn" id="go">Fly!</button>`;
    mountPlop(document.getElementById('ov-plop'), { outfit: '#2E86AB' });
    document.getElementById('go').onclick = e => { e.stopPropagation(); start(); };
  }
  function start() { reset(); state = 'play'; overlay.style.display = 'none'; bird.v = -U * 50; }

  const LINES = ['Plop hit a chimney. Merry Christmas.', 'Plop flew into Stephansdom. Again.', 'That chimney came out of nowhere.', 'Plop needs flying lessons.', 'Santa\'s sleigh would never.'];
  function die() {
    if (state !== 'play') return;
    state = 'dead'; shake = 10;
    const isBest = saveBest('flappy', score); hud();
    const line = LINES[Math.floor(Math.random() * LINES.length)];
    setTimeout(() => {
      overlay.style.display = 'flex';
      overlay.innerHTML = `<h2>BONK!</h2><p>${line}</p>
        <p style="font-size:26px;margin:4px 0">Score: <b>${score}</b> · 🍞 ${nCrumbs}</p>
        <p>${isBest && score > 0 ? '⭐ New best! ⭐' : 'Best: ' + best()}</p>
        <button class="btn" id="again">Try again</button>
        <a class="btn btn-reply" target="_blank" rel="noopener" href="${whatsappLink('Day 23: I got ' + score + ' in Flappy Plop 🐦 (' + nCrumbs + ' bread)')}">Brag to Sofi</a>`;
      document.getElementById('again').onclick = e => { e.stopPropagation(); start(); };
    }, 600);
  }

  // ---------- update ----------
  const ground = () => H - U * 9;
  function update(dt) {
    const speed = U * (28 + Math.min(14, score * .6));
    if (state === 'play') {
      bird.v += U * 190 * dt; bird.y += bird.v * dt;
      if (bird.y + bird.r > ground()) { bird.y = ground() - bird.r; return die(); }
      if (bird.y - bird.r < 0) { bird.y = bird.r; bird.v = 0; }
      // spawn chimneys
      spawnX -= speed * dt;
      if (spawnX < W) {
        const gap = U * Math.max(25, 34 - score * .5);
        const top = U * 12 + Math.random() * (ground() - gap - U * 24);
        pipes.push({ x: W + U * 4, w: U * 11, top, gap, scored: false });
        if (Math.random() < .55) crumbs.push({ x: W + U * 9.5, y: top + gap / 2, got: false });
        spawnX = W + U * 44;
      }
      pipes.forEach(p => {
        p.x -= speed * dt;
        if (!p.scored && p.x + p.w < bird.x) { p.scored = true; score++; hud(); }
        const hitX = bird.x + bird.r * .8 > p.x && bird.x - bird.r * .8 < p.x + p.w;
        if (hitX && (bird.y - bird.r * .75 < p.top || bird.y + bird.r * .75 > p.top + p.gap)) die();
      });
      crumbs.forEach(c => {
        c.x -= speed * dt;
        if (!c.got && Math.hypot(c.x - bird.x, c.y - bird.y) < bird.r * 1.3) { c.got = true; nCrumbs++; hud(); }
      });
      pipes = pipes.filter(p => p.x > -p.w - 10);
      crumbs = crumbs.filter(c => c.x > -20 && !c.got);
    } else if (state === 'dead') {
      bird.v += U * 190 * dt; bird.y = Math.min(ground() - bird.r, bird.y + bird.v * dt);
      shake = Math.max(0, shake - dt * 30);
    } else {
      bird.y = H * .42 + Math.sin(performance.now() / 300) * U * 2;
    }
  }

  // ---------- draw ----------
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  const SKY = [];
  for (let i = 0; i < 40; i++) SKY.push([Math.random(), Math.random() * .6, Math.random() < .3 ? 3 : 2]);

  function drawBg(tt) {
    px(0, 0, W, H, '#2B2238');
    px(0, H * .55, W, H * .45, '#352C5E');
    SKY.forEach(([x, y, s]) => px(x * W, y * H, s, s, Math.sin(tt * 2 + x * 20) > .6 ? '#FBE3A1' : '#F3E6CF'));
    ctx.fillStyle = '#F3E6CF'; ctx.beginPath(); ctx.arc(W * .78, H * .11, U * 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#2B2238'; ctx.beginPath(); ctx.arc(W * .78 + U * 1.8, H * .11 - U * 1.2, U * 3.6, 0, 7); ctx.fill();
    // far skyline with Stephansdom (scrolls slowly)
    const off = -(tt * U * 4) % (W * 1.2);
    for (let k = 0; k < 2; k++) {
      const bx = off + k * W * 1.2;
      for (let i = 0; i < 12; i++) {
        const h = U * (8 + (i * 7) % 11), x = bx + i * W * .1;
        px(x, ground() - h, W * .1 + 1, h, '#241D3A');
      }
      const sx = bx + W * .55;
      px(sx, ground() - U * 22, U * 6, U * 22, '#241D3A');
      px(sx + U * 1.5, ground() - U * 34, U * 3, U * 12, '#241D3A');
      px(sx + U * 2.5, ground() - U * 40, U * 1, U * 6, '#241D3A');
    }
  }

  function drawChimney(p) {
    // bottom: house with snowy roof + chimney
    const bTop = p.top + p.gap;
    px(p.x, bTop, p.w, ground() - bTop, '#8E5F36');
    for (let y = bTop + U * 3; y < ground() - U * 3; y += U * 6) {
      px(p.x + p.w * .18, y, p.w * .24, U * 3, (Math.floor(y / U) % 3) ? '#F6D365' : '#3A2A20');
      px(p.x + p.w * .58, y, p.w * .24, U * 3, (Math.floor(y / U) % 2) ? '#F6D365' : '#3A2A20');
    }
    px(p.x - U, bTop, p.w + U * 2, U * 2.5, '#FFFFFF');
    px(p.x, bTop, 3, ground() - bTop, '#3A2A20'); px(p.x + p.w - 3, bTop, 3, ground() - bTop, '#3A2A20');
    // top: hanging chimney stack with icicles
    px(p.x + p.w * .1, 0, p.w * .8, p.top, '#B5473A');
    for (let y = 0; y < p.top; y += U * 3) px(p.x + p.w * .1, y, p.w * .8, 2, '#8E2F27');
    px(p.x, p.top - U * 3, p.w, U * 3, '#7A2A22');
    for (let i = 0; i < 4; i++) px(p.x + i * p.w / 4 + 2, p.top, U * 1, U * (1.5 + (i % 2) * 1.5), '#DDF3FF');
    px(p.x + p.w * .1, 0, 3, p.top, '#3A2A20'); px(p.x + p.w * .9 - 3, 0, 3, p.top, '#3A2A20');
  }

  function draw() {
    const tt = performance.now() / 1000;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBg(tt);
    pipes.forEach(drawChimney);
    crumbs.forEach(c => {
      const b = Math.sin(tt * 5 + c.x) * 2;
      px(c.x - U * 2, c.y - U + b, U * 4, U * 2.2, '#D9A066'); px(c.x - U * 1.6, c.y - U * 1.4 + b, U * 3.2, U * .8, '#E9C48A');
    });
    // ground (snow)
    px(0, ground(), W, H - ground(), '#F4F8FB'); px(0, ground(), W, 3, '#CFDCE6');
    // snow
    for (let i = 0; i < 30; i++) {
      const sx = (i * 97 + tt * 12 * (1 + i % 3)) % W, sy = (i * 61 + tt * 30 * (1 + i % 2)) % H;
      px(sx, sy, 3, 3, 'rgba(255,255,255,.8)');
    }
    // Plop
    const s = bird.r * 2.4, rot = Math.max(-.5, Math.min(1.2, bird.v / (U * 120)));
    ctx.translate(bird.x, bird.y); ctx.rotate(state === 'dead' ? 1.4 : rot);
    const frame = state === 'play' ? (Math.floor(tt * 10) % 2) : (state === 'ready' ? Math.floor(tt * 4) % 2 : 0);
    ctx.drawImage(SPR[frame], -s / 2, -s / 2, s, s);
    ctx.restore();
    // big score
    if (state === 'play') {
      ctx.font = `600 ${U * 8}px "Pixelify Sans", monospace`; ctx.textAlign = 'center';
      ctx.fillStyle = '#3A2A20'; ctx.fillText(score, W / 2 + 3, U * 13 + 3);
      ctx.fillStyle = '#FFF8EC'; ctx.fillText(score, W / 2, U * 13);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  resize(); showReady(); hud();
  addEventListener('resize', () => { resize(); if (state !== 'play') reset(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
